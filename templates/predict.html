<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Result - Health & Demographic Data</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4 font-sans">

    <div class="bg-white shadow-xl rounded-2xl p-8 max-w-md w-full text-center border-t-4 border-blue-500 transform transition-all">
        
        {% if pred is not none %}
            <div class="mb-8">
                <h2 class="text-sm uppercase tracking-widest text-slate-500 font-bold mb-3">
                    Predicted Life Expectancy
                </h2>
                <div class="text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-teal-400">
                    {{ pred }}
                </div>
            </div>
        {% else %}
            <div class="mb-8">
                <h2 class="text-xl text-red-500 font-semibold">No prediction generated.</h2>
                <p class="text-slate-500 text-sm mt-2">Please submit the form first.</p>
            </div>
        {% endif %}

        <a href="/" class="inline-flex items-center justify-center w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg transition duration-300 ease-in-out shadow-md hover:shadow-lg transform hover:-translate-y-0.5">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
            </svg>
            Go Back to Input Form
        </a>

    </div>

</body>
</html>
